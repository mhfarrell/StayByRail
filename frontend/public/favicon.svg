<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Roof / triangular top -->
  <path d="M4 14 L16 5 L28 14" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bed base -->
  <rect x="6" y="14" width="20" height="8" rx="1.5" fill="#2563eb"/>
  <!-- Pillow -->
  <rect x="8.5" y="16" width="5" height="3.5" rx="1.2" fill="#0ea5e9"/>
  <!-- Blanket surface -->
  <rect x="15" y="17.5" width="8.5" height="4.5" rx="1" fill="#0ea5e9" opacity="0.5"/>
  <!-- Bed legs -->
  <rect x="7" y="22" width="1.8" height="2.5" rx="0.5" fill="#2563eb"/>
  <rect x="23.2" y="22" width="1.8" height="2.5" rx="0.5" fill="#2563eb"/>
  <!-- Rail track -->
  <line x1="2" y1="27.5" x2="30" y2="27.5" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="2" y1="30.5" x2="30" y2="30.5" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Rail ties -->
  <line x1="5" y1="26.2" x2="5" y2="31.8" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10.5" y1="26.2" x2="10.5" y2="31.8" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="26.2" x2="16" y2="31.8" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="21.5" y1="26.2" x2="21.5" y2="31.8" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="27" y1="26.2" x2="27" y2="31.8" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
</svg>
