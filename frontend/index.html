    <!-- AI Search Optimization (LLMs, Perplexity, ChatGPT, etc.) -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!-- Google AdSense site verification. This is the ownership claim
         tag Google checks before approval. The live ad <script> is
         loaded dynamically by AdUnit.jsx so that it respects cookie
         consent, but the verification meta tag has to be in the HTML
         head regardless. -->
    <meta name="google-adsense-account" content="ca-pub-5959061200329505" />

    <!-- Theme resolution inline script. Runs before React mounts so
         light-mode users don't see a dark flash on first paint. The
         actual useTheme() hook in App.jsx uses the same logic; this
         just pre-applies the result so the CSS picks it up immediately. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("staybyrail_theme");
          var theme;
          if (saved === "light" || saved === "dark") {
            theme = saved;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          } else {
            theme = "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <!-- Favicon — multi-size set. Modern browsers prefer the SVG; older
         browsers and Google Search results fall back to favicon.ico, and
         iOS uses the 180px apple-touch-icon. 192/512 are referenced from
         site.webmanifest for Android home-screen installs. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Leaflet CSS is bundled with the HotelMap lazy chunk (see HotelMap.jsx) so it only
         loads when the user actually reaches a page with a map. -->

    <!-- Fonts — Inter (everywhere) + IBM Plex Mono (prices/times only).
         Preconnect hints let the browser open the TLS connection to Google
         Fonts in parallel with HTML parsing, shaving ~100-300ms off LCP. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
