<!doctype html>
<html lang="en">
  <head>

    <!-- Primary SEO -->

    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://staybyrail.co.uk" />

    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!-- Favicon — multi-size set. Modern browsers prefer the SVG; older
         browsers and Google Search results fall back to favicon.ico, and
         iOS uses the 180px apple-touch-icon. 192/512 are referenced from
         site.webmanifest for Android home-screen installs. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Leaflet CSS is bundled with the HotelMap lazy chunk (see HotelMap.jsx) so it only
         loads when the user actually reaches a page with a map. -->

    <!-- Structured Data (JSON-LD) for AI and Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "StayByRail",
      "url": "https://staybyrail.co.uk",
      "description": "Find hotels near train stations across Europe and Asia. Search by train line in 52 cities, filter by amenities, compare prices from Booking.com, Agoda, Expedia and other booking sites.",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      },
      "featureList": [
        "Search hotels by train line proximity",
        "52 cities across Japan, UK, France, Germany, Spain, and Thailand",
        "Filter by amenities (fridge, Wi-Fi, onsen, pool, etc.)",
        "Walking distance from station filter",
        "Price comparison across Booking.com, Agoda, Expedia and more",
        "Interactive OpenStreetMap display",
        "Sort by price, rating, distance, or amenity match"
      ],
      "areaServed": [
        {"@type": "Country", "name": "Japan"},
        {"@type": "Country", "name": "United Kingdom"},
        {"@type": "Country", "name": "France"},
        {"@type": "Country", "name": "Germany"},
        {"@type": "Country", "name": "Spain"},
        {"@type": "Country", "name": "Thailand"}
      ]
    }
    </script>

    <!-- FAQ Structured Data (helps appear in AI answers) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I find hotels near a specific train line?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Select your city, choose a train line (e.g. Yamanote Line in Tokyo, Central Line in London, Metro Line 1 in Paris), set your dates and budget, and see hotels sorted by walking distance from each station."
          }
        },
        {
          "@type": "Question",
          "name": "Which cities and countries does StayByRail cover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "StayByRail covers 52 cities across 6 countries: Japan (Tokyo, Osaka, Kyoto and 9 more), UK (London, Manchester, Birmingham and 10 more), France (Paris, Lyon, Marseille and 4 more), Germany (Berlin, Munich, Hamburg and 5 more), Spain (Madrid, Barcelona, Valencia and 4 more), and Thailand (Bangkok, Chiang Mai, Phuket and 2 more)."
          }
        },
        {
          "@type": "Question",
          "name": "Can I filter hotels by amenities?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. StayByRail has an amenity wishlist where you can select up to 5 must-have features (fridge, Wi-Fi, onsen, pool, gym, kitchen, etc.). Hotels are scored and colour-coded based on how many of your requirements they meet."
          }
        }
      ]
    }
