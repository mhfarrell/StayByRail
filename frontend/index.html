      "@context": "https://schema.org",

      "applicationCategory": "TravelApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      },
      "featureList": [
        "Search hotels by train line proximity",
        "12 Japanese cities covered",
        "Filter by amenities (fridge, Wi-Fi, onsen, pool, etc.)",

        "Price comparison across Booking.com, Agoda, Expedia and more",

    <!-- FAQ Structured Data (helps appear in AI answers) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I find hotels near the Yamanote Line in Tokyo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "StayByRail lets you search hotels by train line. Select Tokyo, choose the Yamanote Line, set your dates and budget, and see hotels sorted by walking distance from each station."
          }
        },
        {
          "@type": "Question",
          "name": "Which Japanese cities are covered by StayByRail?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "StayByRail covers 12 cities: Tokyo, Osaka, Kyoto, Hiroshima, Fukuoka, Sapporo, Nagoya, Yokohama, Kobe, Nara, Kanazawa, and Sendai, with all their major train and subway lines."
          }
        },
        {
          "@type": "Question",
          "name": "Can I filter hotels by amenities like a fridge or onsen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. StayByRail has an amenity wishlist where you can select up to 5 must-have features (fridge, Wi-Fi, onsen, pool, gym, kitchen, etc.). Hotels are scored and colour-coded based on how many of your requirements they meet."

        }
